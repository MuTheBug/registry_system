<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية حقنا - نموذج تسجيل البيانات</title>
    <style>
        @font-face {
            font-family: 'Tajawal';
            src: url('/fonts/Tajawal-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Tajawal';
            src: url('/fonts/Tajawal-Bold.ttf') format('truetype');
            font-weight: 700;
        }
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-label: #94a3b8;
            --border: #334155;
            --bg-input: #0f172a;
            --success: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .logo-section { display: flex; align-items: center; gap: 20px; }
        .logo { width: 80px; height: 80px; background: #fff; border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: center; }
        .logo img { max-width: 100%; max-height: 100%; }
        .title-group h1 { margin: 0; font-size: 1.8em; color: var(--text); }
        .title-group p { margin: 5px 0 0; color: var(--text-label); font-size: 0.95em; }

        .form-section { background: var(--card-bg); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .step-num { background: var(--primary); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9em; flex-shrink: 0; }
        .section-header h2 { margin: 0; font-size: 1.25em; color: var(--text); }

        .g { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .g2 { grid-template-columns: 1fr 1fr; }
        .fg { display: flex; flex-direction: column; gap: 8px; }
        .spanall { grid-column: 1 / -1; }

        label { color: var(--text-label); font-size: 0.9em; font-weight: 700; }
        input, select, textarea {
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95em;
            transition: all 0.3s;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }

        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; position: relative; }
        .upload-area:hover { border-color: var(--primary); background: rgba(59,130,246,0.05); }
        .upload-area input[type=file] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        .upload-area.done { border-color: var(--success); background: rgba(16,185,129,0.05); }

        .cond { display: none; margin-top: 15px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 15px; border-right: 4px solid var(--primary); }
        .cond.show { display: block; animation: fadeIn 0.4s ease; }

        .child-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .child-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }

        .radio-group { display: flex; gap: 20px; padding: 10px 0; }
        .radio-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-item input { width: 18px; height: 18px; margin: 0; cursor: pointer; }

        .btn-group { display: flex; gap: 15px; margin-top: 40px; }
        button { padding: 15px 30px; border-radius: 14px; font-family: inherit; font-weight: 700; cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: #fff; flex: 2; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .btn-reset { background: var(--border); color: var(--text); flex: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .g, .g2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-section">
            <div class="logo"><img src="/logo.jpg" alt="Logo"></div>
            <div class="title-group">
                <h1>جمعية حقنا</h1>
                <p>نموذج تسجيل بيانات المعتقلين والمغيبين قسرياً</p>
            </div>
        </div>
    </div>

    <form id="mainForm">
        <!-- Section 1: Basic Info -->
        <div class="form-section">
            <div class="section-header"><div class="step-num">1</div><h2>المعلومات الشخصية</h2></div>
            <div class="g">
                <div class="fg"><label>الاسم *</label><input type="text" name="firstName" required></div>
                <div class="fg"><label>اسم الأب *</label><input type="text" name="fatherName" required></div>
                <div class="fg"><label>الكنية *</label><input type="text" name="lastName" required></div>
                <div class="fg"><label>الجنس *</label>
                    <select name="gender" required>
                        <option value="">-- اختر --</option>
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                </div>
                <div class="fg"><label>اسم الأم *</label><input type="text" name="motherName" required></div>
                <div class="fg"><label>تاريخ الميلاد *</label>
                    <div style="display:flex; gap:5px;">
                        <select name="dob_day" required><option value="">اليوم</option></select>
                        <select name="dob_month" required><option value="">الشهر</option></select>
                        <select name="dob_year" required><option value="">السنة</option></select>
                    </div>
                </div>
                <div class="fg"><label>المحافظة *</label>
                    <select name="governorate" required>
                        <option value="">-- اختر --</option>
                        <option>دمشق</option><option>ريف دمشق</option><option>حلب</option><option>حمص</option><option>حماة</option><option>اللاذقية</option><option>طرطوس</option><option>إدلب</option><option>دير الزور</option><option>الرقة</option><option>الحسكة</option><option>درعا</option><option>السويداء</option><option>القنيطرة</option>
                    </select>
                </div>
                <div class="fg"><label>الرقم الوطني *</label><input type="text" name="nationalId" required maxlength="11"></div>
                <div class="fg"><label>رقم التواصل</label><input type="tel" name="phone" placeholder="+9639XXXXXXXXX"></div>

                <div class="fg spanall"><label>العنوان الحالي *</label><input type="text" name="address" required placeholder="المدينة - الحي - الشارع"></div>
                <div class="fg"><label>نوع السكن *</label>
                    <select name="housing_type" required>
                        <option value="">-- اختر --</option>
                        <option>ملك</option><option>آجار</option><option>مركز إيواء</option><option>استضافة</option>
                    </select>
                </div>
                <div class="fg"><label>مبلغ الآجار (إن وجد)</label><input type="number" name="rent_amount" placeholder="بالليرة السورية"></div>
                <div class="fg"><label>زمرة الدم</label>
                    <select name="bloodType">
                        <option value="">-- اختر --</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                </div>
            </div>
            <div class="g" style="margin-top:20px;">
                <div class="fg"><label>صورة شخصية</label>
                    <div class="upload-area" id="up_photo"><span id="fl_photo">📷 اختر صورة</span><input type="file" name="photo" accept="image/*" onchange="updateFileName(this, 'fl_photo')"></div>
                </div>
                <div class="fg"><label>وثيقة إثبات</label>
                    <div class="upload-area" id="up_doc"><span id="fl_doc">📄 ارفق وثيقة</span><input type="file" name="document" accept="image/*,.pdf" onchange="updateFileName(this, 'fl_doc')"></div>
                </div>
            </div>
        </div>

        <!-- Section 2: Arrest Info -->
        <div class="form-section">
            <div class="section-header"><div class="step-num">2</div><h2>معلومات الاعتقال / الحالة</h2></div>
            <div class="fg spanall" style="margin-bottom:20px;">
                <label>الحالة الحالية للمعتقل *</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="status" value="survivor" checked onchange="toggleStatus()"> ناجٍ (على قيد الحياة)</label>
                    <label class="radio-item"><input type="radio" name="status" value="deceased" onchange="toggleStatus()"> متوفى (تحت التعذيب / قصف / إعدام)</label>
                </div>
            </div>
            <div class="g">
                <div class="fg"><label>تاريخ الاعتقال *</label>
                    <div style="display:flex; gap:5px;">
                        <select name="doa_day" required><option value="">اليوم</option></select>
                        <select name="doa_month" required><option value="">الشهر</option></select>
                        <select name="doa_year" required><option value="">السنة</option></select>
                    </div>
                </div>
                <div class="fg"><label>مكان الاعتقال *</label>
                    <select name="arrestPlace" required onchange="toggleOther(this, 'otherArrestBox')">
                        <option value="">-- اختر --</option>
                        <option>فرع فلسطين</option><option>فرع الخطيب</option><option>صيدنايا</option><option>الأمن العسكري</option><option>المخابرات الجوية</option><option>أمن الدولة</option><option value="others">أخرى...</option>
                    </select>
                </div>
                <div class="fg cond" id="otherArrestBox" style="margin:0; padding:0; border:none; display:none;"><label>تحديد المكان</label><input type="text" id="otherArrestPlace"></div>
                <div class="fg"><label>الجهة المسؤولة</label><input type="text" name="arrestEntity" required></div>
                <div class="fg spanall"><label>سبب الاعتقال (إن وجد)</label><textarea name="arrestReason" required rows="2"></textarea></div>
            </div>
            <div id="sec_deceased" class="cond">
                <div class="fg"><label>مكان / سبب الوفاة</label><input type="text" name="deathPlace" placeholder="مثلاً: سجن صيدنايا - تصفية"></div>
            </div>
        </div>

        <!-- Section 3: Family & Education -->
        <div class="form-section">
            <div class="section-header"><div class="step-num">3</div><h2>المعلومات الاجتماعية والعائلية</h2></div>
            <div class="g">
                <div class="fg"><label>الحالة الاجتماعية *</label>
                    <select name="socialStatus" required onchange="toggleSocial(this)">
                        <option value="">-- اختر --</option>
                        <option value="single">عازب</option><option value="married">متزوج</option><option value="widowed">أرمل</option><option value="divorced">مطلق</option>
                    </select>
                </div>
                <div class="fg"><label for="education">التحصيل الدراسي *</label>
                    <select id="education" name="education" required onchange="toggleEducationFields()">
                        <option value="">-- اختر --</option>
                        <option>أمي</option><option>ابتدائي</option><option>إعدادية</option><option>ثانوية</option><option>معهد</option><option>بكالوريوس</option><option>ماجستير</option><option>دكتوراه</option>
                    </select>
                </div>
                <div class="fg cond" id="edu_type_container" style="display:none; margin:0; padding:0; border:none;">
                    <label>نوع الثانوية</label>
                    <select name="edu_type"><option value="">-- اختر --</option><option>علمي</option><option>ادبي</option></select>
                </div>
                <div class="fg cond spanall" id="higher_edu_fields" style="display:none; margin:0; padding:0; border:none;">
                    <div class="g g2">
                        <div class="fg"><label>الاختصاص</label><input type="text" name="specialization"></div>
                        <div class="fg"><label>الجامعة</label><input type="text" name="university" value="جامعة اللاذقية"></div>
                    </div>
                </div>
            </div>

            <div id="marriage_section" class="cond" style="border-right:none; padding:0; margin-top:20px;">
                <div class="g">
                    <div class="fg"><label>عدد الأطفال</label><input type="number" name="kidsCount" value="0" min="0" onchange="renderKids('M')"></div>
                    <div class="fg"><label>هل المعتقل هو المعيل؟</label>
                        <select name="breadwinner" onchange="toggleBreadwinner(this)">
                            <option value="yes">نعم</option><option value="no">لا</option>
                        </select>
                    </div>
                    <div id="bw_job_box" class="fg" style="display:none;"><label>مهنة المعيل الحالي</label><input type="text" name="breadwinner_job"></div>
                </div>
                <div id="kidsBox" style="margin-top:20px;"></div>
            </div>

            <div id="widowed_section" class="cond" style="border-right:none; padding:0; margin-top:20px;">
                <div class="g"><div class="fg"><label>عدد الأطفال</label><input type="number" name="kidsCountW" value="0" min="0" onchange="renderKids('W')"></div></div>
                <div id="kidsBoxW" style="margin-top:20px;"></div>
            </div>
        </div>

        <!-- Section 4: Health -->
        <div class="form-section">
            <div class="section-header"><div class="step-num">4</div><h2>الحالة الصحية</h2></div>
            <div class="g">
                <div class="fg"><label class="radio-item"><input type="checkbox" name="has_hypertension"> ضغط دم</label></div>
                <div class="fg"><label class="radio-item"><input type="checkbox" name="has_diabetes"> سكري</label></div>
                <div class="fg"><label class="radio-item"><input type="checkbox" name="has_special_needs" onchange="toggleSpecialNeeds(this)"> ذوي احتياجات خاصة</label></div>
                <div class="fg spanall cond" id="special_needs_box"><label>تفاصيل الاحتياجات الخاصة</label><textarea name="special_needs_details" rows="2"></textarea></div>
                <div class="fg spanall"><label>أمراض أخرى (أضف بفاصلة)</label><input type="text" name="other_diseases" placeholder="مثلاً: ربو، ديسك..."></div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-primary">💾 حفظ وإرسال البيانات</button>
            <button type="button" class="btn-reset" onclick="resetAll()">🔄 إعادة تعيين</button>
        </div>
    </form>
</div>

<script>
function fillSelect(name, start, end) {
    const els = document.getElementsByName(name);
    els.forEach(sel => {
        for(let i=start; i<=end; i++){
            let o = document.createElement('option'); o.value=i; o.text=i; sel.add(o);
        }
    });
}
fillSelect('dob_day', 1, 31); fillSelect('dob_month', 1, 12); fillSelect('dob_year', 1940, 2024);
fillSelect('doa_day', 1, 31); fillSelect('doa_month', 1, 12); fillSelect('doa_year', 2011, 2024);

function updateFileName(inp, id) { if(inp.files[0]){ document.getElementById(id).textContent='✅ '+inp.files[0].name; inp.parentElement.classList.add('done'); } }
function toggleOther(sel, id){ document.getElementById(id).style.display = (sel.value==='others')?'block':'none'; }
function toggleStatus(){ document.getElementById('sec_deceased').style.display = (document.querySelector('[name=status]:checked').value==='deceased')?'block':'none'; }
function toggleSocial(sel){
    document.getElementById('marriage_section').classList.remove('show');
    document.getElementById('widowed_section').classList.remove('show');
    if(sel.value==='married') document.getElementById('marriage_section').classList.add('show');
    else if(sel.value==='widowed' || sel.value==='divorced') document.getElementById('widowed_section').classList.add('show');
}
function toggleEducationFields(){
    const v = document.getElementById('education').value;
    document.getElementById('edu_type_container').style.display = (v==='ثانوية')?'block':'none';
    document.getElementById('higher_edu_fields').style.display = (['معهد','بكالوريوس','ماجستير','دكتوراه'].includes(v))?'block':'none';
}
function toggleBreadwinner(sel){ document.getElementById('bw_job_box').style.display = (sel.value==='no')?'block':'none'; }
function toggleSpecialNeeds(chk){ document.getElementById('special_needs_box').style.display = (chk.checked)?'block':'none'; }

function renderKids(prefix){
    const count = parseInt(document.getElementsByName('kidsCount'+(prefix==='W'?'W':''))[0].value) || 0;
    const box = document.getElementById(prefix==='W'?'kidsBoxW':'kidsBox');
    let html = '';
    const eduOpts = ['أمي','ابتدائي','إعدادية','ثانوية','معهد','بكالوريوس','ماجستير','دكتوراه'];
    for(let i=1; i<=count; i++){
        const uid = prefix.toLowerCase() + i;
        html += `<div class="child-box">
            <div class="child-header">الطفل ${i}</div>
            <div class="g">
                <div class="fg"><label>الاسم</label><input type="text" name="cName_${uid}"></div>
                <div class="fg"><label>العمر</label><input type="number" name="cAge_${uid}"></div>
                <div class="fg"><label>الجنس</label><select name="cGender_${uid}"><option>ذكر</option><option>انثى</option></select></div>
                <div class="fg"><label>التعليم</label><select name="cEdu_${uid}" onchange="toggleChildEdu(this,'${uid}')">${eduOpts.map(o=>`<option>${o}</option>`).join('')}</select></div>
                <div class="fg" id="cType_${uid}" style="display:none"><label>نوع الثانوية</label><select name="cEduType_${uid}"><option>علمي</option><option>ادبي</option></select></div>
                <div class="fg spanall" id="cHigher_${uid}" style="display:none"><div class="g g2">
                    <div class="fg"><label>الاختصاص</label><input type="text" name="cSpec_${uid}"></div>
                    <div class="fg"><label>الجامعة</label><input type="text" name="cUniv_${uid}" value="جامعة اللاذقية"></div>
                </div></div>
            </div>
        </div>`;
    }
    box.innerHTML = html;
}
function toggleChildEdu(sel, uid){
    document.getElementById('cType_'+uid).style.display = (sel.value==='ثانوية')?'block':'none';
    document.getElementById('cHigher_'+uid).style.display = (['معهد','بكالوريوس','ماجستير','دكتوراه'].includes(sel.value))?'block':'none';
}

document.getElementById('mainForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    try {
        const fd = new FormData(e.target);
        if(fd.get('arrestPlace')==='others') fd.set('arrestPlace', document.getElementById('otherArrestPlace').value);
        const resp = await fetch('/api/records', { method:'POST', body:fd });
        const res = await resp.json();
        if(resp.ok){ alert('تم الحفظ بنجاح! رقم السجل: '+res.id); location.reload(); }
        else alert('خطأ: '+res.error);
    } catch(err){ alert('فشل الاتصال'); }
    finally { btn.disabled = false; }
};
</script>
</body>
</html>
