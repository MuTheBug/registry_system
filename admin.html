<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - جمعية حقنا</title>
    <style>
        @font-face {
            font-family: 'Tajawal';
            src: url('/fonts/Tajawal-Regular.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Tajawal';
            src: url('/fonts/Tajawal-Bold.ttf') format('truetype');
            font-weight: 700;
        }
        :root {
            --bg: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --amber: #f59e0b;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Tajawal', sans-serif; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; }
        .nav-links { list-style: none; padding: 0; margin: 0; }
        .nav-links li { padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; color: var(--text-muted); }
        .nav-links li.active { background: var(--primary); color: #fff; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        .stat-card p { margin: 10px 0 0; font-size: 2em; font-weight: 700; color: var(--primary); }

        .filters { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 30px; display: flex; gap: 15px; flex-wrap: wrap; border: 1px solid var(--border); }
        .filters input, .filters select { background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 10px 15px; border-radius: 8px; font-family: inherit; }
        .filters button { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        .data-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
        .data-table th { background: rgba(0,0,0,0.2); text-align: right; padding: 15px 20px; color: var(--text-muted); font-size: 0.9em; }
        .data-table td { padding: 15px 20px; border-top: 1px solid var(--border); font-size: 0.95em; }

        .thumbnail { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #334155; cursor: pointer; }
        .action-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        .edit-btn { border-color: var(--amber); color: var(--amber); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); margin: 5% auto; padding: 30px; border-radius: 20px; width: 80%; max-width: 900px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .close { color: var(--text-muted); font-size: 28px; cursor: pointer; }

        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .edit-grid .full { grid-column: span 2; }
        .edit-grid input, .edit-grid select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-family: inherit; }
    </style>
</head>
<body>

<div class="sidebar">
    <div style="text-align:center;"><img src="/logo.jpg" style="width:60px;"><h2 style="font-size:1.2em; margin-top:15px;">لوحة الإدارة</h2></div>
    <ul class="nav-links"><li class="active">📊 سجل المعتقلين</li><li onclick="location.href='/logout'">🚪 تسجيل الخروج</li></ul>
    <div style="margin-top:auto; padding:20px; background:rgba(0,0,0,0.2); border-radius:12px;">
        <h4 style="margin:0 0 10px; font-size:0.9em;">تصفية سريعة</h4>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <input type="number" id="filter-kids-count" placeholder="عدد الأطفال">
            <input type="number" id="filter-kids-under18" placeholder="تحت سن 18">
            <button onclick="applyFilters()">تطبيق</button>
        </div>
    </div>
</div>

<div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h1>سجل المعتقلين</h1>
        <button onclick="location.href='/form.html'" style="background:var(--success); color:#fff; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:700;">+ إضافة سجل جديد</button>
    </div>

    <div class="stats">
        <div class="stat-card"><h3>إجمالي السجلات</h3><p id="stat-total">0</p></div>
        <div class="stat-card"><h3>ذكور</h3><p id="stat-males">0</p></div>
        <div class="stat-card"><h3>إناث</h3><p id="stat-females">0</p></div>
    </div>

    <div class="filters">
        <input type="text" id="search-name" placeholder="بحث بالاسم..." oninput="applyFilters()">
        <select id="filter-gov" onchange="applyFilters()">
            <option value="">كل المحافظات</option>
            <option>دمشق</option><option>ريف دمشق</option><option>حلب</option><option>حمص</option><option>حماة</option><option>اللاذقية</option><option>طرطوس</option><option>إدلب</option><option>دير الزور</option><option>الرقة</option><option>الحسكة</option><option>درعا</option><option>السويداء</option><option>القنيطرة</option>
        </select>
        <button id="apply-filters" onclick="applyFilters()">تحديث</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th><th>الصورة</th><th>الاسم الكامل</th><th>الجنس</th><th>المحافظة</th><th>الاعتقال</th><th>الأطفال</th><th>تحت 18</th><th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>
</div>

<!-- Modals -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h2 id="modal-title">التفاصيل</h2><span class="close" onclick="closeModal('detailsModal')">&times;</span></div>
        <div id="modal-body"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h2>تعديل السجل</h2><span class="close" onclick="closeModal('editModal')">&times;</span></div>
        <div class="edit-grid" id="edit-form">
            <div><label>الاسم الأول</label><input type="text" id="edit-firstName"></div>
            <div><label>اسم الأب</label><input type="text" id="edit-fatherName"></div>
            <div><label>الكنية</label><input type="text" id="edit-lastName"></div>
            <div><label>الرقم الوطني</label><input type="text" id="edit-nationalId"></div>
            <div><label>الجنس</label><select id="edit-gender"><option value="male">ذكر</option><option value="female">أنثى</option></select></div>
            <div><label>المحافظة</label><input type="text" id="edit-governorate"></div>
            <div class="full"><button id="saveEdit" style="background:var(--primary); color:#fff; padding:12px; border-radius:8px; cursor:pointer; width:100%; font-weight:700;">حفظ</button></div>
        </div>
    </div>
</div>

<script>
let allData = [];
async function loadData(){
    try {
        const resp = await fetch('/api/records');
        const data = await resp.json();
        allData = data.records || []; // Handle object with records key
        renderTable(allData);
        updateStats(allData);
    } catch(err){ console.error(err); }
}

function renderTable(data){
    const body = document.getElementById('data-body');
    body.innerHTML = data.map(r => `
        <tr>
            <td>#${r.id}</td>
            <td><img src="${r.photo_path || 'https://via.placeholder.com/40'}" class="thumbnail" onclick="viewMedia('${r.photo_path}')"></td>
            <td>${escapeHTML(r.first_name)} ${escapeHTML(r.father_name)} ${escapeHTML(r.last_name)}</td>
            <td>${r.gender==='male'?'ذكر':'أنثى'}</td>
            <td>${escapeHTML(r.province)}</td>
            <td>${r.arrest_year}/${r.arrest_month}/${r.arrest_day}</td>
            <td>${r.kids_count || 0}</td>
            <td>${r.kids_under_18_count || 0}</td>
            <td>
                <button class="action-btn" onclick="viewDetails(${r.id})">عرض</button>
                <button class="action-btn edit-btn" onclick="openEdit(${r.id})">تعديل</button>
            </td>
        </tr>
    `).join('');
}

function updateStats(data){
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-males').textContent = data.filter(r=>r.gender==='male').length;
    document.getElementById('stat-females').textContent = data.filter(r=>r.gender==='female').length;
}

function applyFilters(){
    const name = document.getElementById('search-name').value.toLowerCase();
    const gov = document.getElementById('filter-gov').value;
    const kids = parseInt(document.getElementById('filter-kids-count').value) || 0;
    const u18 = parseInt(document.getElementById('filter-kids-under18').value) || 0;

    const filtered = allData.filter(r => {
        const matchName = (r.first_name + ' ' + r.last_name).toLowerCase().includes(name);
        const matchGov = !gov || r.province === gov;
        const matchKids = r.kids_count >= kids;
        const matchU18 = r.kids_under_18_count >= u18;
        return matchName && matchGov && matchKids && matchU18;
    });
    renderTable(filtered);
}

function escapeHTML(str){ if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function closeModal(id){ document.getElementById(id).style.display = 'none'; }

function viewDetails(id){
    const r = allData.find(x=>x.id===id);
    const body = document.getElementById('modal-body');
    body.innerHTML = `
        <div style="display:grid; grid-template-columns: 1fr 2fr; gap:30px;">
            <div><img src="${r.photo_path || 'https://via.placeholder.com/150'}" style="width:100%; border-radius:15px; border:2px solid var(--border);">
                 <button class="action-btn" style="width:100%; margin-top:20px;" onclick="viewMedia('${r.document_path}')">📄 عرض الوثيقة</button></div>
            <div>
                <h3>${escapeHTML(r.first_name)} ${escapeHTML(r.father_name)} ${escapeHTML(r.last_name)}</h3>
                <p><b>الرقم الوطني:</b> ${escapeHTML(r.national_id)}</p>
                <p><b>العنوان:</b> ${escapeHTML(r.address)} (${escapeHTML(r.housing_type)})</p>
                <p><b>التعليم:</b> ${escapeHTML(r.education)} ${r.edu_type?'('+r.edu_type+')':''}</p>
                <p><b>الاعتقال:</b> ${r.arrest_year}/${r.arrest_month}/${r.arrest_day} - ${escapeHTML(r.arrest_place)}</p>
                <p><b>الحالة الصحية:</b> ${r.has_hypertension?'ضغط، ':''}${r.has_diabetes?'سكري، ':''}${escapeHTML(r.other_diseases)}</p>
            </div>
        </div>
    `;
    document.getElementById('modal-title').textContent = 'تفاصيل السجل';
    document.getElementById('detailsModal').style.display='block';
}

let currentEditId = null;
function openEdit(id){
    const r = allData.find(x=>x.id===id);
    currentEditId = id;
    document.getElementById('edit-firstName').value = r.first_name;
    document.getElementById('edit-fatherName').value = r.father_name;
    document.getElementById('edit-lastName').value = r.last_name;
    document.getElementById('edit-nationalId').value = r.national_id;
    document.getElementById('edit-gender').value = r.gender;
    document.getElementById('edit-governorate').value = r.province;
    document.getElementById('editModal').style.display = 'block';
}

document.getElementById('saveEdit').onclick = async () => {
    const data = {
        firstName: document.getElementById('edit-firstName').value,
        fatherName: document.getElementById('edit-fatherName').value,
        lastName: document.getElementById('edit-lastName').value,
        nationalId: document.getElementById('edit-nationalId').value,
        gender: document.getElementById('edit-gender').value,
        governorate: document.getElementById('edit-governorate').value
    };
    const resp = await fetch(`/api/records/${currentEditId}`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    });
    if(resp.ok){ closeModal('editModal'); loadData(); }
};

function viewMedia(url){
    if(!url) return;
    const isPdf = url.toLowerCase().endsWith('.pdf');
    const body = document.getElementById('modal-body');
    body.innerHTML = `<div style="text-align:center;">${isPdf?`<iframe src="${url}" style="width:100%; height:500px; border:none;"></iframe>`:`<img src="${url}" style="max-width:100%;">`}</div>`;
    document.getElementById('modal-title').textContent='عرض الملف';
    document.getElementById('detailsModal').style.display='block';
}

loadData();
</script>
</body>
</html>
